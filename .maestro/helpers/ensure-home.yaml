appId: com.purrrfectkeys.app
name: Ensure Home Screen
---
# Helper: Ensure we're on the HomeScreen
# The app can be in multiple states after launch:
# 1. Dev launcher → connect to Metro
# 2. Dev menu (tools) → dismiss
# 3. Onboarding → complete 4 steps
# 4. Auth → skip sign-in
# 5. Onboarding again (appears after auth skip for first-time users)
# 6. Home screen

# Phase 1: Dismiss dev launcher/menu
- runFlow: dismiss-dev-launcher.yaml

# Phase 2: Wait for the app to settle
- waitForAnimationToEnd:
    timeout: 5000

# Phase 2a: Handle onboarding if it's the first screen
- runFlow:
    when:
      visible:
        id: "onboarding-get-started"
    file: complete-onboarding.yaml

# Phase 3: Skip auth if shown
- runFlow:
    when:
      visible:
        id: "auth-screen"
    commands:
      - tapOn:
          id: "skip-signin"
      - waitForAnimationToEnd:
          timeout: 8000

# Phase 4: Handle onboarding AFTER auth skip (first-time user flow)
- runFlow:
    when:
      visible:
        id: "onboarding-get-started"
    file: complete-onboarding.yaml

# Phase 5: Final wait for home screen
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
