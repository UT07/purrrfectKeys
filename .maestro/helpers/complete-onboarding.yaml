appId: com.purrrfectkeys.app
name: Complete Onboarding
---
# Helper: Complete the 7-step onboarding wizard
# Uses extendedWaitUntil between steps to ensure transitions complete

# Step 1: Welcome → Get Started
- tapOn:
    id: "onboarding-get-started"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-2"
    timeout: 8000

# Step 2: Experience level
- tapOn:
    id: "onboarding-experience-beginner"
- tapOn:
    id: "onboarding-experience-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-3"
    timeout: 8000

# Step 3: Input method
- tapOn:
    id: "onboarding-input-touch"
- tapOn:
    id: "onboarding-input-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-4"
    timeout: 8000

# Step 4: Learning goal
- tapOn:
    id: "onboarding-goal-songs"
- tapOn:
    id: "onboarding-goal-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-5"
    timeout: 8000

# Step 5: Choose learning path (list overflows screen on smaller devices)
- tapOn:
    id: "onboarding-path-piano-basics"
# Swipe up to reveal Next button below the 5 path options
- swipe:
    direction: UP
    duration: 500
# Tap Next by point (PressableScale testID not detected by Maestro on iOS)
- tapOn:
    point: "50%,83%"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-6"
    timeout: 8000

# Step 6: Choose cat companion
- tapOn:
    id: "onboarding-choose-mini-meowww"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "onboarding-cat-next"
- extendedWaitUntil:
    visible:
      id: "onboarding-step-7"
    timeout: 8000

# Step 7: Pick Username → Finish
- tapOn:
    id: "onboarding-username-input"
- inputText: "e2etester"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "onboarding-finish"
    timeout: 10000
- tapOn:
    id: "onboarding-finish"
- waitForAnimationToEnd:
    timeout: 5000
