appId: com.purrrfectkeys.app
name: Dismiss Dev Launcher
---
# Helper: Dismiss Expo dev client launcher if present
# Handles: server list → dev tools menu → intro modal (in any order)

# Wait for the app to render
- waitForAnimationToEnd:
    timeout: 3000

# State 1: Dev server list (fresh clearState launch) — connect to Metro
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - tapOn:
          text: "http://localhost:8081"
      - waitForAnimationToEnd:
          timeout: 35000

# State 2: Dev client intro modal — tap Continue
- runFlow:
    when:
      visible: "This is the developer menu"
    commands:
      - tapOn:
          text: "Continue"
      - waitForAnimationToEnd:
          timeout: 3000

# State 3: Dev tools menu (Reload, Go home, etc.) — tap "Go home" to close
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn:
          text: "Go home"
      - waitForAnimationToEnd:
          timeout: 5000

# Retry: if dev tools menu appeared again, dismiss once more
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn:
          text: "Go home"
      - waitForAnimationToEnd:
          timeout: 5000
