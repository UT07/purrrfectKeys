# ──────────────────────────────────────────────────────────────
#  Build — Preview & Production
# ──────────────────────────────────────────────────────────────
# Manual-only builds via EAS. NO auto-triggers on push.
#
# Preview:  Internal testing builds (ad-hoc distribution)
#           Can target any branch via workflow_dispatch.
#
# Production: Store-ready builds (auto-increment version)
#             Should only target master with verified, stable code.
#
# Required GitHub Secrets:
#   EXPO_TOKEN                    - Expo account token
#   GOOGLE_SERVICE_INFO_PLIST     - base64 iOS Firebase config
#   GOOGLE_SERVICES_JSON          - base64 Android Firebase config
#
# EAS Secrets (set via `eas secret:push`):
#   EXPO_PUBLIC_FIREBASE_API_KEY, EXPO_PUBLIC_FIREBASE_PROJECT_ID, etc.
# ──────────────────────────────────────────────────────────────
name: Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - ios
          - android
          - all

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  # ── Quality Gate ──────────────────────────────
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml

  # ── iOS Build ───────────────────────────────
  build-ios:
    name: iOS ${{ inputs.profile }} Build
    needs: [quality-gate]
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Firebase configs
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p firebase
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > firebase/GoogleService-Info.plist
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > firebase/google-services.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger iOS build
        run: |
          eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
          echo "### iOS ${{ inputs.profile }} Build Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: \`${{ inputs.profile }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Track progress at [expo.dev](https://expo.dev/accounts/ut254/projects/purrrfect-keys/builds)" >> "$GITHUB_STEP_SUMMARY"

  # ── Android Build ───────────────────────────
  build-android:
    name: Android ${{ inputs.profile }} Build
    needs: [quality-gate]
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Firebase configs
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p firebase
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > firebase/GoogleService-Info.plist
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > firebase/google-services.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger Android build
        run: |
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
          echo "### Android ${{ inputs.profile }} Build Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: \`${{ inputs.profile }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Track progress at [expo.dev](https://expo.dev/accounts/ut254/projects/purrrfect-keys/builds)" >> "$GITHUB_STEP_SUMMARY"
